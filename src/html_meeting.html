  <div class="container">

    <div class="px-2 mb-3">
      <small id="progressText" class="text-primary fw-bold">สถานะ: เตรียมพร้อม</small>

        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 33%"></div>
      </div>
    </div>

    <div class="card shadow">
      <div class="header-box text-center">
        <h4 class="mb-0 text-white"><?= config.title || 'การประชุม' ?></h4>
        <p class="mb-0 small text-white-50"><?= config.subtitle || '' ?></p>
      </div>

      <div class="card-body p-4">
        <div id="view-step1" class="view-content active">
          <h5 class="text-primary mb-3 fw-bold text-center">ภารกิจที่ 1: ข้อมูลทั่วไป</h5>
          <div class="mb-3">
            <label class="form-label fw-bold small">ชื่อ-นามสกุล</label>
            <input type="text" id="name" class="form-control form-control-lg"
              placeholder="ระบุคำนำหน้าชื่อ ชื่อ-นามสกุล" oninput="saveState()">
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold small">บทบาทหน้าที่</label>
            <select id="role" class="form-select form-control-lg" onchange="saveState()">
              <option value="">-- เลือกบทบาท --</option>
              <? 
                var rolesStr = config.roles || '';
                var rolesArray = rolesStr.split(',');
                for (var i = 0; i < rolesArray.length; i++) {
                  var r = rolesArray[i].trim();
                  if (r !== '') {
              ?>
              <option value="<?= r ?>"><?= r ?></option>
              <? 
                  }
                }
              ?>

          <button class="btn btn-primary btn-lg w-100 py-3 fw-bold" onclick="checkStepBeforeNext(3)">ส่งภารกิจที่ 2

        <div id="view-step3" class="view-content">
          <h5 class="text-primary mb-3 fw-bold text-center">ภารกิจที่ 3: ตอบคำถามสรุป</h5>
          <label class="small fw-bold"><?= config.question || 'ท่านมีความพร้อมในการจัดสอบเพียงใด?' ?></label>
          <input type="text" id="q2" class="form-control mb-4" placeholder="ระบุคำตอบ">

          <button id="btnSubmit" class="btn btn-success btn-lg w-100 py-3 fw-bold"
            onclick="submitForm()">เสร็จสิ้นภารกิจ</button>
        </div>

  <div id="adminModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; align-items:center; justify-content:center;">
    <div class="bg-white p-4 rounded-4 shadow-lg text-center mx-3" style="max-width:320px; width:100%;">
      <h5>รหัส Admin</h5>
      <input type="password" id="adminPinInput" class="form-control mb-3 text-center" placeholder="****">
      <button class="btn btn-primary w-100 mb-2" onclick="verifyAdmin()">เข้าสู่โหมดควบคุม</button>
      <button class="btn btn-link text-muted btn-sm" onclick="closeAdminModal()">ยกเลิก</button>
    </div>
  </div>

  <script>
    let uploadedFileUrl = "";
    let targetStep = 1;
    let scriptUrl = "";

    window.onload = function () {
      google.script.run.withSuccessHandler(url => scriptUrl = url).getScriptUrl();
      loadSavedState();
    };

    function saveState() {
      localStorage.setItem('meeting_state', JSON.stringify({
        name: document.getElementById('name').value,
        role: document.getElementById('role').value,
        uploadedFileUrl: uploadedFileUrl,
        targetStep: targetStep
      }));
    }

    function loadSavedState() {
      const saved = localStorage.getItem('meeting_state');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (data.name) document.getElementById('name').value = data.name;
          if (data.role) document.getElementById('role').value = data.role;
          if (data.uploadedFileUrl) {
            uploadedFileUrl = data.uploadedFileUrl;
            document.getElementById('previewContainer').innerHTML = `<div class="alert alert-success py-1 small mb-2">✅ พร้อมใช้งาน (จากข้อมูลเดิม)</div><img src="${uploadedFileUrl}" class="img-fluid rounded shadow" style="max-height:150px;">`;
          }
          if (data.targetStep) {
            targetStep = data.targetStep;
            reCheckStep();
          }
        } catch (e) {}
      }
    }

    function switchView(viewId) {
      document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function checkStepBeforeNext(nextS) {
      if (nextS === 2 && !document.getElementById('name').value) { 
        Swal.fire({ icon: 'warning', title: 'เตือน', text: "กรุณากรอกชื่อก่อนครับ" }); 
        return; 
      }
      if (nextS === 3 && !uploadedFileUrl) { 
        Swal.fire({ icon: 'warning', title: 'เตือน', text: "กรุณารอการอัปโหลดรูปภาพให้สำเร็จก่อนครับ" }); 
        return; 
      }
      targetStep = nextS;
      saveState();
      reCheckStep();
    }

    function reCheckStep() {
      google.script.run.withSuccessHandler(function (serverStep) {
        if (targetStep <= serverStep) {
          switchView('view-step' + targetStep);
          updateProgress(targetStep);
        } else {
          switchView('view-waiting');
        }
      }).getCurrentAllowedStep();
    }

    function updateProgress(s) {
      document.getElementById('progressBar').style.width = (s === 1 ? '33%' : (s === 2 ? '66%' : '100%'));
      document.getElementById('progressText').innerText = `สถานะ: ภารกิจที่ ${s}`;
    }

    // อัปโหลดรูป Real-time
    document.getElementById('photo').addEventListener('change', function (e) {
      const file = e.target.files[0];
      const name = document.getElementById('name').value;
      const reader = new FileReader();
      reader.onload = e => {
        const base64 = e.target.result;
        document.getElementById('previewContainer').innerHTML = `<div class="alert alert-warning py-1 small mb-2">⏳ กำลังส่งรูปภาพ...</div><img src="${base64}" class="img-fluid rounded opacity-50" style="max-height:150px;">`;
        google.script.run.withSuccessHandler(function (res) {
          if (res.status === 'success') {
            uploadedFileUrl = res.url;
            document.getElementById('previewContainer').innerHTML = `<div class="alert alert-success py-1 small mb-2">✅ พร้อมใช้งาน</div><img src="${base64}" class="img-fluid rounded shadow" style="max-height:150px;">`;
            saveState();
          } else {
            document.getElementById('previewContainer').innerHTML = `<div class="alert alert-danger py-1 small mb-2">❌ ผิดพลาด: ${res.message}</div>`;
            Swal.fire('ผิดพลาด', 'อัปโหลดรูปภาพไม่สำเร็จ: ' + res.message, 'error');
          }
        }).withFailureHandler(function(err) {
          document.getElementById('previewContainer').innerHTML = `<div class="alert alert-danger py-1 small mb-2">❌ ผิดพลาด: การเชื่อมต่อมีปัญหา</div>`;
          Swal.fire('ผิดพลาด', 'เกิดปัญหาการเชื่อมต่อกับเซิร์ฟเวอร์', 'error');
        }).uploadImageOnly(base64, name);
      };
      reader.readAsDataURL(file);
    });

    function submitForm() {
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true; btn.innerHTML = "กำลังบันทึก...";
      google.script.run.withSuccessHandler(res => {
        if (res.status === 'success') {
          localStorage.removeItem('meeting_state');
          google.script.run.withSuccessHandler(html => document.body.innerHTML = html).getSuccessPage();
        } else { 
          Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message }); 
          btn.disabled = false; btn.innerText = "ส่งอีกครั้ง"; 
        }
      }).uploadData({
        name: document.getElementById('name').value,
        role: document.getElementById('role').value,
        fileUrl: uploadedFileUrl,
        q2: document.getElementById('q2').value
      });
    }

    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }
    function verifyAdmin() {
      if (document.getElementById('adminPinInput').value === "2568") {
        window.top.location.href = scriptUrl + "?page=meeting&mode=admin";
      } else { 
        Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: "รหัสผิด!" }); 
        closeAdminModal(); 
      }
    }
  </script>
</body>

</html>
