  <script>
    let allData = [];
    let selectedList = [];
    let teacherName = "";

    // 1. เข้าแอป
    function enterApp() {
      const name = document.getElementById('teacherInput').value.trim();
      if (!name) return Swal.fire('กรุณากรอกชื่อ', 'เพื่อให้ระบบนำไปใส่ในใบงานให้ท่านครับ', 'warning');

      teacherName = name;
      document.getElementById('displayTeacherName').innerText = teacherName;
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      loadWords();
    }

    // 2. โหลดคำศัพท์
    function loadWords() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('word-grid').innerHTML = '';
      google.script.run.withSuccessHandler(data => {
        allData = data;
        renderFilters(data);
        renderGrid(data);
      }).getWords();
    }

    // 3. สร้างปุ่มกรองหมวดหมู่
    function renderFilters(data) {
      const filtersDiv = document.getElementById('category-filters');
      filtersDiv.innerHTML = '';

      const categories = [...new Set(data.map(item => item.category))];

      // ปุ่มทั้งหมด
      const btnAll = document.createElement('button');
      btnAll.className = 'btn filter-btn active';
      btnAll.innerHTML = 'ทั้งหมด';
      btnAll.onclick = function () {
        updateActiveBtn(this);
        document.getElementById('status-text').innerText = 'ทั้งหมด';
        renderGrid(allData);
      };
      filtersDiv.appendChild(btnAll);

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'btn filter-btn btn-outline-primary';
        btn.innerText = cat;
        btn.onclick = function () {
          updateActiveBtn(this);
          document.getElementById('status-text').innerText = 'หมวด: ' + cat;
          const filtered = allData.filter(item => item.category === cat);
          renderGrid(filtered);
        };
        filtersDiv.appendChild(btn);
      });
    }

    function updateActiveBtn(clickedBtn) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active', 'btn-primary'));
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.add('btn-outline-primary'));
      clickedBtn.classList.remove('btn-outline-primary');
      clickedBtn.classList.add('active', 'btn-primary');
    }

    // 4. แสดงตารางคำศัพท์
    function renderGrid(items) {
      const grid = document.getElementById('word-grid');
      grid.innerHTML = '';
      document.getElementById('loading').style.display = 'none';

      if (items.length === 0) {
        grid.innerHTML = '<div class="text-center py-5 text-muted">ไม่พบข้อมูลคำศัพท์ในหมวดนี้</div>';
        return;
      }

      items.forEach(item => {
        const isSelected = selectedList.includes(item.word) ? 'selected' : '';
        const col = document.createElement('div');
        col.className = 'col-6 col-md-4 col-xl-3';
        col.innerHTML = `
        <div class="word-card shadow-sm ${isSelected}" onclick="toggleWord(this, '${item.word}')">
          <div class="word-main">${item.word}</div>
          <div class="word-cat-label">${item.category}</div>
        </div>
      `;
        grid.appendChild(col);
      });
    }

    // 5. เลือก/ยกเลิกคำศัพท์
    function toggleWord(el, word) {
      const idx = selectedList.indexOf(word);
      if (idx === -1) {
        selectedList.push(word);
        el.classList.add('selected');
      } else {
        selectedList.splice(idx, 1);
        el.classList.remove('selected');
      }
      document.getElementById('count').innerText = selectedList.length;
      document.getElementById('basket').innerText = selectedList.length > 0 ? selectedList.join(', ') : 'ยังไม่ได้เลือกคำศัพท์...';
    }

    // 6. ล้างข้อมูล
    function refreshApp() {
      selectedList = [];
      document.getElementById('count').innerText = '0';
      document.getElementById('basket').innerText = 'ยังไม่ได้เลือกคำศัพท์...';
      loadWords();
      Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'รีเซ็ตข้อมูลใหม่แล้ว', showConfirmButton: false, timer: 1500 });
    }

    // 7. สร้างใบงาน
    function generate() {
      if (selectedList.length === 0) return Swal.fire('ยังไม่ได้เลือกคำ!', 'กรุณาคลิกเลือกคำศัพท์ที่ต้องการก่อนครับ', 'warning');

      const type = document.querySelector('input[name="st"]:checked').value;
      Swal.fire({
        title: 'กำลังสร้างใบงาน', text: 'ระบบกำลังทำงานภายใต้ชื่อ ' + teacherName,
        allowOutsideClick: false, didOpen: () => Swal.showLoading()
      });

      google.script.run.withSuccessHandler(url => {
        Swal.close();
        if (url.startsWith("Error")) return Swal.fire('เกิดข้อผิดพลาด', url, 'error');

        Swal.fire({
          title: 'สร้างสำเร็จ!', text: 'คุณครูสามารถเปิดดูและสั่งพิมพ์ได้เลยครับ',
          icon: 'success', confirmButtonText: '📂 เปิดดูใบงาน', confirmButtonColor: '#34a853'
        }).then(r => { if (r.isConfirmed) window.open(url, '_blank'); });
      }).createWorksheet(selectedList, type, teacherName);
    }

    function hideAdminDashboard() {
      document.getElementById('admin-view').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
    }
  </script>
